name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.config.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config:
          - { name: default, features: "" }
          - { name: secure, features: secure }
          - { name: override, features: override }
          - { name: secure+override, features: "secure,override" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --verbose --features "${{ matrix.config.features }}"

      - name: Test
        run: cargo test --verbose --features "${{ matrix.config.features }}"

  msrv:
    name: msrv / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
