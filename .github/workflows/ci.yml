name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.config.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config:
          - { name: default, features: "" }
          - { name: secure, features: secure }
          - { name: override, features: override }
          - { name: secure+override, features: "secure,override" }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --verbose --features "${{ matrix.config.features }}"

      - name: Test
        run: cargo test --verbose --features "${{ matrix.config.features }}"

      - name: Show build script output on failure
        if: failure()
        shell: bash
        run: |
          echo "== OUT_DIR build scripts =="
          find target -path '*/build/mimalloc-*/out' -type d 2>/dev/null | head -5
          find target -name 'build-script-build*' -o -name 'output' 2>/dev/null | head -20
          # Cargo stores stderr from build scripts under target/*/build/*/stderr or in verbose log above
          ls -la target/debug/build/ 2>/dev/null | head -30 || true
          for d in target/debug/build/mimalloc-*; do
            echo "---- $d ----"
            ls -la "$d" 2>/dev/null || true
            [ -f "$d/stderr" ] && echo 'stderr:' && cat "$d/stderr"
            [ -f "$d/stdout" ] && echo 'stdout:' && cat "$d/stdout"
          done

  msrv:
    name: msrv / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Show build script output on failure
        if: failure()
        shell: bash
        run: |
          for d in target/debug/build/mimalloc-*; do
            echo "---- $d ----"
            ls -la "$d" 2>/dev/null || true
            [ -f "$d/stderr" ] && echo 'stderr:' && cat "$d/stderr"
            [ -f "$d/stdout" ] && echo 'stdout:' && cat "$d/stdout"
          done
