[package]
name = "mimalloc"
version = "3.6.0"
edition = "2024"
rust-version = "1.85"
description = "Rust wrapper for Microsoft's mimalloc allocator — a compact general purpose allocator with excellent performance"
repository = "https://github.com/amsokol/mimalloc"
license = "MIT"
keywords = ["allocator", "global-allocator", "memory", "mimalloc"]
categories = ["api-bindings", "memory-management"]

[build-dependencies]
cc = "1.8"

[features]
default = []
override = []
no_thp = []
secure = []
